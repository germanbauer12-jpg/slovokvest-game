    <div class="challenge-box">
      <div class="challenge-num">СловоКвест · Вызов дня</div>
      <div class="challenge-stars">${stars}</div>
      <div class="result-stats">${s.time}с · ${s.errors} ош.</div>
      <div class="challenge-line">🔥 Серия: ${s.streak} · +${s.coins} 🪙</div>
    </div>
    <button class="btn btn-primary" data-action="home">На главную</button>
    <button class="btn btn-ghost" data-action="share-result" data-text="${shareTxt.replace(/"/g,'&quot;')}">📤 Поделиться</button>
    ${authorFooter()}`;
}

function familyHTML(){
  const cards=FAMILY_STORIES.map((s,i)=>{
    const done=state.familyRead.includes(i);
    return `<div class="family-card" data-action="start-family" data-i="${i}">
      <div class="fam-emoji">${s.emoji}</div>
      <div class="fam-title">${s.title}${done?' ✓':''}</div>
      <div class="fam-sub">${s.parts.length} вопроса</div>
    </div>`;
  }).join('');
  return `<button class="back" data-action="home">← На главную</button>
    <h2>👨‍👩‍👧 Семейный вечер</h2>
    <p class="sub">Короткие истории для чтения вслух.</p>
    ${cards}
    ${authorFooter()}`;
}
function familyStoryHTML(){
  const s=session;
  const story=FAMILY_STORIES[s.familyIndex];
  const step=s.familyStep;
  if(step<story.parts.length){
    const opts=story.choices[step].map((c,i)=>
      `<button class="btn btn-opt anim-in" style="animation-delay:${0.1+i*0.12}s"
        data-action="family-pick" data-i="${i}">${c}</button>`).join('');
    return `<button class="back" data-action="open-family">← Истории</button>
      <h2>${story.emoji} ${story.title}</h2>
      <div class="card"><p style="font-size:16px">${story.parts[step]}</p></div>
      ${opts}`;
  }
  return `<button class="back" data-action="open-family">← Истории</button>
    <h2>${story.emoji} ${story.title}</h2>
    <div class="card" style="text-align:center">
      <div style="font-size:48px">🌙</div>
      <p style="font-size:16px">Спасибо за вечер!</p>
    </div>
    <button class="btn btn-primary" data-action="open-family">Ещё</button>
    <button class="btn btn-ghost" data-action="home">На главную</button>`;
}

function epilogueHTML(){
  let fox='Лисёнок остался в Лесу.';
  if(state.flags.helped_fox)fox='Лисёнок стал твоим первым учеником.';
  let bard='Бард сложил о тебе песню, но забыл слова.';
  if(state.flags.rhymed)bard='Бард написал о тебе балладу.';
  else if(state.flags.listened)bard='Бард молча кивнул тебе при встрече.';
  let sphinx='Сфинкс остался считать песчинки.';
  if(state.flags.answered_sphinx)sphinx='Сфинкс признал тебя равным.';
  else if(state.flags.stalled_sphinx)sphinx='Сфинкс дал тебе время.';
  const ngText = state.ngPlus ? '<p style="color:#ffd700">Ты прошёл путь второй раз. Мир снова ждёт — но теперь ты знаешь его тайны.</p>' : '';
  const shareTxt=`Прошёл СловоКвест! Ур.${state.level} · 🎴${state.cards.length} · 🏆${state.achievements.length}`;
  return `<div style="text-align:center;margin-bottom:16px">
    <div style="font-size:56px">📖</div>
    <h1>${state.ngPlus?'Эпилог NG+':'Эпилог'}</h1>
  </div>
  <div class="card">
    <div class="epilogue-text">
      <p>Дверь закрылась за твоей спиной.</p>
      <p>${fox}</p>
      <p>${bard}</p>
      <p>${sphinx}</p>
      ${ngText}
      <p>Но истории не заканчиваются — они ждут, когда их напишут заново.</p>
    </div>
  </div>
  <div class="stats-list">
    <div class="stats-row"><span>Глав пройдено</span><b>${state.completed.length}</b></div>
    <div class="stats-row"><span>Карточек</span><b>${state.cards.length}</b></div>
    <div class="stats-row"><span>Достижений</span><b>${state.achievements.length} / ${ACHIEVEMENTS.length}</b></div>
    <div class="stats-row"><span>Уровень</span><b>${state.level}</b></div>
    <div class="stats-row"><span>В игре</span><b>${fmtPlayTime(state.stats.playTimeMs||0)}</b></div>
    ${state.ngPlus?`<div class="stats-row"><span>NG+ пройдено</span><b>${state.stats.ngPlusCompletions||0}</b></div>`:''}
  </div>
  <button class="btn btn-primary" data-action="home">На главную</button>
  <button class="btn btn-ghost" data-action="share-result" data-text="${shareTxt.replace(/"/g,'&quot;')}">📤 Поделиться</button>
  ${!state.ngPlus?`<button class="btn btn-ghost" data-action="start-ngplus">🔄 Начать NG+</button>`:''}
  ${authorFooter()}`;
}

function perkHTML(){
  const p=state.pendingPerkChoice;
  if(!p)return '';
  const cards=p.options.map(o=>
    `<div class="perk-card" data-action="pick-perk" data-id="${o.id}">
      <div class="perk-emoji">${o.emoji}</div>
      <div class="perk-name">${o.name}</div>
      <div class="perk-desc">${o.desc}</div>
    </div>`).join('');
  return `<h2>🎁 Новый уровень!</h2>
    <p class="sub">Уровень ${p.level} · Выбери перк</p>
    <div>${cards}</div>`;
}
function perkChosenHTML(){
  const p=state.lastPerk;
  if(!p)return '';
  return `<h2>🎁 Перк получен</h2>
    <div class="card" style="text-align:center">
      <div style="font-size:56px">${p.emoji}</div>
      <h2 style="color:#f7e8b0">${p.name}</h2>
      <p class="sub">${p.desc}</p>
    </div>
    <button class="btn btn-primary" data-action="home">Продолжить</button>`;
}

function confetti(){
  const colors=['#f0c25c','#e2645a','#5cc98a','#7ab8f5','#c98ae0','#f0d68a','#ffffff'];
  const box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999';
  document.body.appendChild(box);
  for(let i=0;i<34;i++){
    const p=document.createElement('div');const size=6+Math.random()*9;
    p.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-20px;
      width:${size}px;height:${size}px;background:${colors[i%colors.length]};
      border-radius:${Math.random()>0.5?'50%':'2px'};
      --drift:${(Math.random()*240-120).toFixed(0)}px;
      animation:confettiFall ${1.6+Math.random()*1.6}s ease-in forwards;
      animation-delay:${(Math.random()*0.4).toFixed(2)}s;`;
    box.appendChild(p);
  }
  setTimeout(()=>box.remove(),4200);
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  if(el.disabled)return;
  const a=el.dataset.action;
  if(['home','go-back','open-collection','open-daily-challenge','open-map','open-training',
      'open-speed','open-family','open-achievements','open-settings','open-license',
      'start-chapter','start-exp','to-choice','to-puzzle','continue','hint','tap-act',
      'toggle-act','restore-lives','claim-gift','start-training','start-speed',
      'start-family','family-pick','open-epilogue','start-ngplus','share-result',
      'start-test','pick-perk','set-fs','set-contrast','toggle-anim','toggle-vib',
      'toggle-notif','onboard-next','onboard-skip','use-second','show-more-banners',
      'share-chapter','export-save','import-save','set-theme'].includes(a)){
    SFX.click();
  }else if(a==='choose'){SFX.select();}

  if(a==='onboard-next'){
    if(onboardStep < ONBOARD_SLIDES.length-1){onboardStep++;render();}
    else{state.tutorialDone=true;save();onboardStep=0;render();}
    return;
  }
  if(a==='onboard-skip'){state.tutorialDone=true;save();onboardStep=0;render();return;}
  if(a==='use-second'){
    if(state.perks.includes('second') && state.secondUsedDate !== todayStr()){
      state.secondUsedDate = todayStr();
      gainLife();
      save();render();
      toast('❤️ Сердце возвращено!');
    }
    return;
  }
  if(a==='show-more-banners'){
    if(session && session.hiddenBanners && session.hiddenBanners.length > 0){
      session.hiddenBanners.forEach(b => {
        const html = renderBanner(b);
        const rewardCard = app.querySelector('.card.reward');
        if(rewardCard){
          const btn = rewardCard.querySelector('[data-action="show-more-banners"]');
          if(btn) btn.insertAdjacentHTML('beforebegin', html);
        }
      });
      session.hiddenBanners = [];
      if(el) el.remove();
    }
    return;
  }
  if(a==='share-chapter'){
    if(session){
      const ch = getChapter(session.id);
      const q = ch.puzzle.question;
      const emojiLine = ch.puzzle.emoji ? '\n' + ch.puzzle.emoji : '';
      shareText(`СловоКвест · ${ch.title}${emojiLine}\n${q}`);
    }
    return;
  }
  if(a==='export-save'){
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    shareText(b64);
    return;
  }
  if(a==='import-save'){
    const b64 = prompt('Вставь код сейва:');
    if(b64){
      try{
        const s = JSON.parse(decodeURIComponent(escape(atob(b64.trim()))));
        state = Object.assign(defaultState(), s);
        save();applySettings();render();
        toast('✅ Сейв загружен');
      }catch(e){toast('❌ Ошибка: неверный код');}
    }
    return;
  }
  if(a==='set-theme'){state.settings.theme=el.dataset.value;applySettings();save();render();return;}

  if(a==='home'){view.screen='home';session=null;save();render();}
  else if(a==='go-back'){
    if(session&&session.mode==='speed'){finishSpeed(false);return;}
    if(session&&session.mode==='challenge'){toast('Вызов будет засчитан только после ответа');return;}
    view.screen='home';session=null;save();render();
  }
  else if(a==='open-collection'){view.screen='collection';render();}
  else if(a==='open-license'){view.screen='license';render();}
  else if(a==='open-daily-challenge'){
    if(state.dailyChallenge.lastDate===todayStr()){
      view.screen='challenge-result';
      const last=state.dailyChallenge.history[state.dailyChallenge.history.length-1];
      if(last){
        session={mode:'challenge-result',day:last.day,time:last.time,stars:last.stars,
                 errors:last.errors,coins:0,streak:state.dailyChallenge.streak};
        render();
      }
    }else{startDailyChallenge();}
  }
  else if(a==='open-map'){view.screen='map';const cur=getCurrentAct();if(cur)view.expandedActs=[cur.id];render();}
  else if(a==='open-training'){view.screen='training';render();}
  else if(a==='open-speed'){view.screen='speed';render();}
  else if(a==='open-family'){view.screen='family';render();}
  else if(a==='open-achievements'){view.screen='achievements';render();}
  else if(a==='open-settings'){view.screen='settings';render();}
  else if(a==='open-epilogue'){view.screen='epilogue';render();}
  else if(a==='tap-act'){view.screen='map';view.expandedActs=[parseInt(el.dataset.act,10)];render();}
  else if(a==='toggle-act'){
    const id=parseInt(el.dataset.act,10);
    if(!isActUnlocked(id)){toast('🔒 Сначала заверши предыдущий акт');return;}
    if(view.expandedActs.includes(id))view.expandedActs=view.expandedActs.filter(x=>x!==id);
    else view.expandedActs.push(id);
    render();
  }
  else if(a==='start-chapter'){startChapter(el.dataset.id);}
  else if(a==='start-test'){startTest(el.dataset.id);}
  else if(a==='start-exp'){startChapter(el.dataset.id);}
  else if(a==='start-training'){startTraining();}
  else if(a==='start-speed'){startSpeedRun();}
  else if(a==='start-family'){session={mode:'family',familyIndex:parseInt(el.dataset.i,10),familyStep:0};view.screen='family-story';render();}
  else if(a==='family-pick'){
    session.familyStep++;
    if(session.familyStep>=FAMILY_STORIES[session.familyIndex].parts.length){
      if(!state.familyRead.includes(session.familyIndex))state.familyRead.push(session.familyIndex);
      state.stats.familyDone++;
      save();checkAchievements();save();
    }
    render();
  }
  else if(a==='start-ngplus'){
    if(!state.stats.epilogueSeen){toast('Сначала пройди сюжет');return;}
    if(confirm('Начать NG+? Прогресс глав сбросится, но перки, карточки, монеты сохранятся.\n\nВ NG+: монеты ×1.5, опыт ×1.3, специальные карточки за прохождение.')){
      state.ngPlus=true;state.completed=[];state.actsRewarded=[];state.flags={};
      save();view.screen='home';render();
      toast('⚔️ NG+ начат! Награды увеличены');
      checkAchievements();save();
    }
  }
  else if(a==='to-choice'){const ch=getChapter(session.id);session.phase=ch.choice?'choice':'puzzle';render();}
  else if(a==='choose'){chooseOption(Number(el.dataset.i));}
  else if(a==='to-puzzle'){session.phase='puzzle';session.error=null;render();}
  else if(a==='submit-input'){submitInput();}
  else if(a==='submit-choice'){submitChoice(el.dataset.value);}
  else if(a==='hint'){showHint();}
  else if(a==='continue'){
    if(session&&session.mode==='test-result'){view.screen='home';session=null;render();return;}
    if(session&&session.mode==='challenge-result'){view.screen='home';session=null;render();return;}
    const ch=session?getChapter(session.id):null;
    const wasLastAct=(ch&&session.actCompleted===ACTS.length);
    const nextId=getNextChapter();
    if(wasLastAct){view.screen='epilogue';session=null;render();return;}
    if(nextId)startChapter(nextId);
    else{view.screen='home';session=null;render();}
  }
  else if(a==='restore-lives'){
    if(state.lives>=currentMaxLives()){toast('Сердца уже полны');return;}
    if(state.coins<LIFE_COST){toast('Не хватает монет');return;}
    if(restoreWithCoins()){SFX.coin();setTimeout(()=>SFX.levelUp(),200);toast('❤️ +1 сердце');render();checkAchievements();save();}
  }
  else if(a==='claim-gift'){
    if(!canClaimDailyGift()){toast('Подарок уже получен');return;}
    const got=claimDailyGift();
    if(got==='heart'){SFX.gift();setTimeout(()=>SFX.card(),300);toast('🎁 +1 ❤️!');}
    else if(got==='coins'){SFX.gift();setTimeout(()=>SFX.coin(),300);toast(`🎁 +${DAILY_GIFT_COINS} 🪙`);}
    render();checkAchievements();save();
  }
  else if(a==='share-result'){shareText(el.dataset.text);}
  else if(a==='pick-perk'){
    const perk=ALL_PERKS.find(p=>p.id===el.dataset.id);
    if(perk){
      state.perks.push(perk.id);state.lastPerk=perk;state.pendingPerkChoice=null;
      save();view.screen='perk-chosen';render();SFX.perk();
    }
  }
  else if(a==='set-fs'){state.settings.fontSize=el.dataset.value;applySettings();save();render();}
  else if(a==='set-contrast'){state.settings.contrast=el.dataset.value;applySettings();save();render();}
  else if(a==='toggle-anim'){state.settings.animations=!state.settings.animations;applySettings();save();render();}
  else if(a==='toggle-vib'){state.settings.vibration=!state.settings.vibration;save();render();if(state.settings.vibration)vibrate(20);}
  else if(a==='toggle-notif'){
    const next=!state.settings.notifications;
    if(next&&'Notification' in window){
      Notification.requestPermission().then(p=>{
        state.settings.notifications=(p==='granted');save();render();
        if(p!=='granted')toast('Уведомления не разрешены');
      });
    }else{state.settings.notifications=next;save();render();}
  }
  else if(a==='toggle-sfx'){
    SFX.muted=!SFX.muted;
    try{localStorage.setItem(MUTE_KEY,SFX.muted?'1':'0');}catch(e){}
    if(!SFX.muted)SFX.click();
    el.textContent=SFX.muted?'🔇':'🔊';
  }
  else if(a==='toggle-music'){
    MUSIC.setMuted(!MUSIC.muted);
    try{localStorage.setItem(MUSIC_KEY,MUSIC.muted?'1':'0');}catch(e){}
    el.textContent=MUSIC.muted?'🔕':'🎵';
  }
  else if(a==='reset'){
    if(confirm('Сбросить весь прогресс? Это действие нельзя отменить.')){
      state=defaultState();save();applySettings();
      view={screen:'home',expandedActs:[1]};
      session=null;lastRenderKey='';render();
    }
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&view.screen==='chapter'&&session&&session.phase==='puzzle'){
    const inp=document.getElementById('puzzle-input');
    if(inp){e.preventDefault();submitInput();}
  }
});

setInterval(()=>{
  const before=state.lives;
  checkLivesRegen();
  const cd=document.getElementById('lives-countdown');
  if(cd&&state.nextLifeAt)cd.textContent=fmtTime(state.nextLifeAt-Date.now());
  const heartsEl=document.getElementById('hud-lives');
  if(heartsEl){
    const max=currentMaxLives();
    const disp=max>BASE_MAX_LIVES?`${state.lives}/${max}`:`${state.lives}`;
    heartsEl.innerHTML=`${heartsEmoji(state.lives)} <b>${disp}</b>`;
  }
  if(state.lives>before){
    const blocked=document.querySelector('.puzzle-blocked');
    const noLives=document.querySelector('.no-lives');
    if((blocked||noLives)&&document.activeElement?.tagName!=='INPUT')render();
  }
},2000);

setInterval(()=>{
  if(!document.hidden){
    state.stats.playTimeMs = (state.stats.playTimeMs || 0) + 30000;
    save();
    checkAchievements();
  }
}, 30000);

checkLivesRegen();
checkPerkTrigger();
checkAchievements();
save();
render();
</script>
</body>
</html>
