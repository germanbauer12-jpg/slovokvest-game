<title>СловоКвест: Хранители Текста</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#352540 0%,#1c1524 45%,#0f0c15 90%) fixed;
  color:#efe9f5;min-height:100vh;padding:16px 14px 40px;line-height:1.55;overflow-x:hidden;transition:background .3s,color .3s}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.3px;background:linear-gradient(180deg,#f7e8b0,#e8b64c 60%,#c08a20);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:14px;margin:18px 0 10px;color:#a99cb8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sub{color:#a99cb8;font-size:13px;margin:0 0 18px}
.hero-wrap{margin-bottom:20px}
.hero-wrap svg{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 10px 40px rgba(240,194,92,.18),0 0 0 1px rgba(240,194,92,.12)}
.hud{display:flex;gap:6px;margin-bottom:18px}
.hud-item{flex:1;background:#251d31;border:1px solid #342a44;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;color:#c9bcd8}
.hud-item b{color:#e8b64c;font-size:15px;display:inline-block}
.hud-item.coin-changed b{animation:coinPop .6s ease}
.hud-item.heart-changed b{animation:heartPop .7s ease}
.hud-mute{flex:0 0 36px;background:#251d31;border:1px solid #342a44;border-radius:12px;font-size:15px;cursor:pointer;color:#c9bcd8;font-family:inherit;padding:0}
.hud-mute:active{transform:scale(.95)}
.card{background:#1e1826;border:1px solid #342a44;border-radius:16px;padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;border:0;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:transform .08s ease;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#f0c25c,#d99f2e);color:#241a05;animation:btnGlow 3s ease-in-out infinite}
.btn-primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 4s ease-in-out infinite;pointer-events:none}
.btn-ghost{background:transparent;color:#c9bcd8;border:1px solid #3d3150}
.btn-gift{background:linear-gradient(180deg,#ffb8c8,#e87a9a);color:#3a1018;animation:giftPulse 2.4s ease-in-out infinite}
.btn-opt{background:#2b2238;color:#efe9f5;border:1px solid #3d3150;text-align:left;font-weight:500;font-size:15px}
.btn-opt:active{background:#3a2d4d}
.anim-in{animation:slideUp .4s ease both}
.chapter-banner{margin:0 0 14px}
.chapter-banner svg{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.world-tag{display:inline-block;font-size:12px;color:var(--accent,#e8b64c);background:rgba(0,0,0,.35);border:1px solid var(--accent,#e8b64c);border-radius:20px;padding:4px 12px;margin-bottom:12px;animation:fadeIn .4s ease both}
.diff-stars{color:#e8b64c;font-size:12px;margin-left:6px;letter-spacing:1px}
.acts-mini{display:flex;gap:5px;justify-content:space-between;margin:4px 0 10px;flex-wrap:wrap}
.act-mini{flex:1;aspect-ratio:1;max-width:44px;min-width:32px;border-radius:10px;background:#251d31;border:1px solid #342a44;display:flex;align-items:center;justify-content:center;font-size:14px;color:#a99cb8;cursor:pointer;user-select:none;transition:all .25s ease}
.act-mini.done{background:linear-gradient(180deg,#24402f,#162a1e);border-color:#5cc98a;color:#7fdfa8}
.act-mini.current{background:linear-gradient(180deg,#4a3a20,#2a1a08);border-color:#e8b64c;color:#e8b64c;box-shadow:0 0 14px rgba(232,182,76,.4);animation:currentPulse 2.4s ease-in-out infinite}
.act-mini.locked{opacity:.4}
.act-banner{margin-bottom:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(240,194,92,.15),rgba(160,80,200,.05));border:1px solid rgba(240,194,92,.35)}
.act-banner .act-num{font-size:11px;color:#f0c25c;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.act-banner .act-title{font-size:16px;font-weight:700;color:#f7e8b0;margin:2px 0 6px}
.act-banner .act-progress-line{font-size:12px;color:#a99cb8;margin-bottom:6px}
.back{background:none;border:0;color:#a99cb8;font-size:15px;padding:0 0 16px;cursor:pointer;font-family:inherit}
.reset{display:block;margin:20px auto 0;background:none;border:0;color:#5b4d70;font-size:12px;cursor:pointer;font-family:inherit}
.puzzle-icon{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(circle,rgba(240,194,92,.22),transparent 70%);border:2px solid var(--accent,#e8b64c);box-shadow:0 0 28px var(--accent,#e8b64c),inset 0 0 20px rgba(240,194,92,.1);animation:puzzlePulse 2.5s ease-in-out infinite}
.story p{margin:0 0 12px;font-size:16px;animation:slideUp .45s ease both}
.variant{color:#e8b64c;font-style:italic;border-left:3px solid #e8b64c;padding-left:12px;margin-bottom:14px;font-size:15px;animation:slideUp .4s ease both}
.prompt{font-size:17px;font-weight:600;margin:0 0 14px;animation:fadeIn .35s ease both}
.hint-box{color:#a99cb8;font-size:14px;margin-top:10px;font-style:italic;animation:fadeIn .3s ease both}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid #3d3150;background:#141018;color:#efe9f5;font-size:17px;font-family:inherit;margin-top:12px}
input[type=text]:focus{outline:0;border-color:#e8b64c;box-shadow:0 0 0 3px rgba(232,182,76,.15)}
.err{color:#e2645a;font-size:14px;margin-top:10px;animation:shake .35s ease}
.shake{animation:shake .35s ease}
.progress{height:8px;background:#251d31;border-radius:8px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#e8b64c,#f0d68a);border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress.blue i{background:linear-gradient(90deg,#5c9ce8,#a8c8f0)}
.progress.pink i{background:linear-gradient(90deg,#e87a9a,#ffb8c8)}
.progress.green i{background:linear-gradient(90deg,#5cc98a,#a8e8c0)}
.reward{text-align:center;padding:16px 12px}
.reward-card-frame{position:relative;width:160px;height:160px;margin:6px auto 22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,rgba(240,194,92,.16),transparent 70%)}
.reward-card-frame::before{content:'';position:absolute;inset:10px;border-radius:50%;border:2px solid var(--accent,#e8b64c);box-shadow:0 0 32px var(--accent,#e8b64c),inset 0 0 24px rgba(240,194,92,.2);animation:ringPulse 2.5s ease-in-out infinite}
.reward-card-frame::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--accent,#e8b64c),transparent 70%);opacity:.18;animation:ringPulse 3s ease-in-out infinite}
.reward-emoji{font-size:78px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));animation:float 2.8s ease-in-out infinite}
.coins-earned{color:#e8b64c;font-weight:700;font-size:20px;margin:10px 0;animation:coinPop .8s ease .5s both}
.reward-new{color:#c9bcd8;font-size:14px;margin-top:6px;animation:slideUp .5s ease .6s both}
.life-earned{color:#ff8a7a;font-size:14px;margin-top:8px;font-weight:600;animation:slideUp .5s ease .75s both}
.exclusive-banner,.bag-banner,.act-complete-banner{margin-top:16px;padding:14px;border-radius:16px;animation:exclusivePop .9s cubic-bezier(.34,1.56,.64,1) .9s both}
.exclusive-banner{background:linear-gradient(135deg,rgba(240,194,92,.2),rgba(232,160,76,.05));border:2px solid #e8b64c;box-shadow:0 0 40px rgba(240,194,92,.4)}
.bag-banner{background:linear-gradient(135deg,rgba(255,140,180,.25),rgba(200,80,140,.08));border:2px solid #ff9ab8;animation:exclusivePop 1s cubic-bezier(.34,1.56,.64,1) 1.1s both,bagGlow 2.5s ease-in-out 2s infinite;box-shadow:0 0 40px rgba(255,140,180,.5)}
.act-complete-banner{background:linear-gradient(135deg,rgba(92,201,138,.2),rgba(92,201,138,.03));border:2px solid #5cc98a;box-shadow:0 0 30px rgba(92,201,138,.35)}
.exclusive-label{font-size:12px;color:#f0d68a;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.act-complete-banner .exclusive-label{color:#a8e8c0}
.bag-banner .exclusive-label{color:#ffd0e0}
.exclusive-emoji{font-size:52px;line-height:1;margin:8px 0;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(240,194,92,.7))}
.exclusive-name{font-size:16px;font-weight:700;color:#f7e8b0;margin:4px 0}
.bag-banner .exclusive-name{color:#ffd0e0}
.act-complete-banner .exclusive-name{color:#c8f0d8}
.exclusive-diff{color:#e8b64c;font-size:14px;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card-tile{position:relative;border-radius:16px;min-height:126px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--accent,#342a44);overflow:hidden;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both}
.card-tile::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,var(--accent,#e8b64c),transparent 65%);opacity:.14;pointer-events:none}
.card-tile.locked{opacity:.38;filter:grayscale(1);border-color:#342a44}
.card-tile.exclusive{border-color:#e8b64c;border-width:2px;box-shadow:0 0 20px rgba(240,194,92,.25) inset,0 0 12px rgba(240,194,92,.2)}
.card-tile.bag{border-color:#ff9ab8;border-width:2px;box-shadow:0 0 24px rgba(255,140,180,.35) inset,0 0 16px rgba(255,140,180,.3)}
.card-tile-emoji{font-size:38px;line-height:1;position:relative;z-index:1}
.card-tile-emoji svg{width:44px;height:44px;display:block}
.card-tile-name{font-size:10px;text-align:center;color:#c9bcd8;margin-top:8px;position:relative;z-index:1;line-height:1.25}
.card-tile-diff{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;color:#f0c25c;letter-spacing:1px;z-index:1}
.card-tile.bag .card-tile-diff{color:#ff9ab8}
.act-block{margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid #342a44;background:#1a141f}
.act-block.locked{opacity:.55}
.act-block.current{border-color:#e8b64c;box-shadow:0 0 24px rgba(232,182,76,.2)}
.act-block.done{border-color:#5cc98a}
.act-header{padding:14px 16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.02)}
.act-header:active{background:rgba(255,255,255,.05)}
.act-num-big{font-size:22px}
.act-head-info{flex:1;min-width:0}
.act-head-title{font-weight:700;font-size:14px;color:#f7e8b0;line-height:1.3}
.act-head-meta{font-size:11px;color:#a99cb8;margin-top:2px}
.act-chevron{font-size:14px;color:#a99cb8;transition:transform .25s ease}
.act-block.expanded .act-chevron{transform:rotate(90deg)}
.act-body{padding:0 16px 16px;display:none}
.act-block.expanded .act-body{display:block}
.act-story-btn{margin-top:6px}
.story-card-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid #e8b64c;background:linear-gradient(135deg,rgba(240,194,92,.2),rgba(232,160,76,.05));color:#f7e8b0;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s ease;position:relative;overflow:hidden}
.story-card-btn:active{transform:scale(.98)}
.story-card-btn.done{background:linear-gradient(135deg,rgba(92,201,138,.2),rgba(92,201,138,.03));border-color:#5cc98a;color:#a8e8c0}
.story-card-btn.locked{opacity:.45;cursor:not-allowed;background:rgba(255,255,255,.02);border-color:#3d3150;color:#a99cb8}
.story-card-btn .crown{font-size:20px}
.exp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.exp-dot{aspect-ratio:1;border-radius:10px;background:#251d31;border:1px solid #342a44;color:#a99cb8;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;position:relative;user-select:none}
.exp-dot:active{transform:scale(.94)}
.exp-dot.done{background:linear-gradient(180deg,#24402f,#162a1e);border-color:#5cc98a;color:#7fdfa8}
.exp-dot.done::after{content:'✓';position:absolute;top:1px;right:3px;font-size:9px;color:#5cc98a}
.exp-dot.locked{opacity:.35;cursor:not-allowed}
.exp-dot.next{background:linear-gradient(180deg,#4a3a20,#2a1a08);border-color:#e8b64c;color:#e8b64c;font-weight:700;animation:currentPulse 2.4s ease-in-out infinite}
.no-lives{text-align:center;padding:16px 8px}
.no-lives-emoji{font-size:48px;margin-bottom:8px}
.no-lives-countdown{font-size:22px;color:#e8b64c;font-weight:700;margin:10px 0;font-variant-numeric:tabular-nums}
.puzzle-blocked{text-align:center}
.puzzle-blocked .no-lives-emoji{font-size:56px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #342a44}
.setting-row:last-child{border-bottom:0}
.setting-label{flex:1;font-size:14px;color:#efe9f5}
.setting-sub{font-size:11px;color:#a99cb8;margin-top:2px}
.setting-controls{display:flex;gap:6px}
.opt-btn{padding:6px 12px;border-radius:8px;border:1px solid #3d3150;background:#251d31;color:#a99cb8;font-family:inherit;font-size:12px;cursor:pointer;min-width:36px}
.opt-btn.active{background:#e8b64c;color:#241a05;border-color:#e8b64c;font-weight:700}
.toggle{width:44px;height:24px;border-radius:12px;background:#3d3150;position:relative;cursor:pointer;transition:background .2s ease}
.toggle.on{background:#5cc98a}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease}
.toggle.on::after{transform:translateX(20px)}
.ach-tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid #342a44;margin-bottom:8px}
.ach-tile.locked{opacity:.4;filter:grayscale(.8)}
.ach-tile .ach-emoji{font-size:26px;width:32px;text-align:center}
.ach-tile .ach-info{flex:1}
.ach-tile .ach-name{font-size:14px;font-weight:600;color:#efe9f5}
.ach-tile .ach-desc{font-size:11px;color:#a99cb8}
.result-big{font-size:56px;text-align:center;margin:10px 0}
.result-stats{text-align:center;font-size:16px;color:#e8b64c;font-weight:700;margin:8px 0}
.challenge-box{text-align:center;padding:20px;background:linear-gradient(135deg,rgba(240,194,92,.15),rgba(200,80,140,.05));border:2px solid #e8b64c;border-radius:16px;margin-bottom:14px}
.challenge-num{font-size:12px;color:#f0c25c;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.challenge-stars{font-size:32px;color:#e8b64c;margin:8px 0;letter-spacing:4px}
.challenge-line{font-size:14px;color:#a99cb8;margin-top:6px}
.family-card{padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(255,140,180,.08),rgba(240,194,92,.05));border:1px solid rgba(240,194,92,.3);margin-bottom:10px;cursor:pointer}
.family-card:active{background:linear-gradient(135deg,rgba(255,140,180,.15),rgba(240,194,92,.1))}
.family-card .fam-emoji{font-size:32px;margin-bottom:6px}
.family-card .fam-title{font-size:15px;font-weight:700;color:#f7e8b0}
.family-card .fam-sub{font-size:12px;color:#a99cb8;margin-top:2px}
.epilogue-text{font-size:16px;line-height:1.7;color:#e8dfd0;margin-bottom:16px;font-style:italic}
.epilogue-text p{margin:0 0 12px}
.stats-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;padding:16px;background:rgba(255,255,255,.03);border-radius:12px}
.stats-row{display:flex;justify-content:space-between;font-size:14px}
.stats-row b{color:#e8b64c}
.perk-card{padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(240,194,92,.2),rgba(160,80,200,.08));border:2px solid #e8b64c;margin-bottom:10px;cursor:pointer;transition:transform .1s ease}
.perk-card:active{transform:scale(.98)}
.perk-card .perk-emoji{font-size:36px;text-align:center;margin-bottom:6px}
.perk-card .perk-name{font-size:16px;font-weight:700;color:#f7e8b0;text-align:center}
.perk-card .perk-desc{font-size:13px;color:#c9bcd8;text-align:center;margin-top:4px}
.speed-hud{display:flex;gap:8px;margin-bottom:14px;background:#251d31;border:1px solid #e8b64c;border-radius:12px;padding:10px}
.speed-hud>div{flex:1;text-align:center;font-size:13px;color:#a99cb8}
.speed-hud b{color:#e8b64c;display:block;font-size:16px}
.author-footer{text-align:center;font-size:11px;color:#5b4d70;margin:20px 0 0;line-height:1.7}
.author-link{color:#e8b64c;text-decoration:none;border-bottom:1px dotted #e8b64c}
.vk-badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:rgba(60,120,200,.25);color:#8ab8e8;font-size:10px;text-decoration:none;font-weight:600}
.onboard{text-align:center;padding:20px 10px}
.onboard-emoji{font-size:80px;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite}
.onboard h2{font-size:22px;color:#f7e8b0;margin:0 0 12px}
.onboard p{font-size:15px;color:#c9bcd8;line-height:1.7;margin:0 0 24px}
.onboard-dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.onboard-dot{width:10px;height:10px;border-radius:50%;background:#3d3150;transition:background .3s ease}
.onboard-dot.active{background:#e8b64c}
.onboard-skip{background:none;border:0;color:#5b4d70;font-size:13px;cursor:pointer;font-family:inherit;margin-top:14px;padding:10px}
.emoji-rebus{font-size:56px;text-align:center;margin:16px 0;letter-spacing:8px;line-height:1.2;animation:fadeIn .4s ease}
body.light{background:radial-gradient(ellipse at 50% 0%,#faf5e8 0%,#f0e8d0 50%,#e8dfc8 100%) fixed;color:#2a1a0f}
body.light h1{background:linear-gradient(180deg,#8a5020,#a07020 60%,#6a4010);-webkit-background-clip:text;background-clip:text;color:transparent}
body.light h2,body.light h3{color:#2a1a0f}
body.light .sub{color:#5a4a3a}
body.light .card{background:#fff;border-color:#d4c8a8;box-shadow:0 2px 8px rgba(0,0,0,.04)}
body.light .hud-item,body.light .hud-mute{background:#fff;border-color:#d4c8a8;color:#5a4a3a}
body.light .hud-item b{color:#8a6018}
body.light .btn-ghost{color:#5a4a3a;border-color:#c4b898}
body.light .btn-opt{background:#fff;color:#2a1a0f;border-color:#c4b898}
body.light .story p,body.light .epilogue-text p{color:#2a1a0f}
body.light .variant{color:#8a6018;border-color:#8a6018}
body.light .back{color:#5a4a3a}
body.light .act-mini{background:#fff;border-color:#d4c8a8;color:#5a4a3a}
body.light .act-mini.done{background:#d8f0d8;border-color:#5cc98a;color:#2a7040}
body.light .act-mini.current{background:#faf0d0;border-color:#e8b64c;color:#8a6018}
body.light .act-block{background:#fff;border-color:#d4c8a8}
body.light .act-head-title{color:#6a4010}

const RU_ALPHABET='АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';

function shuffleLetters(word){
  const a=word.toUpperCase().split('');
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function shuffleOptions(opts,correct){
  const a=[...opts];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(!a.includes(correct))a[0]=correct;
  return a;
}
function shuffleArr(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shiftWord(word,shift){
  return word.toUpperCase().split('').map(ch=>{
    const idx=RU_ALPHABET.indexOf(ch);if(idx<0)return ch;
    return RU_ALPHABET[(idx+shift)%RU_ALPHABET.length];
  }).join('');
}
function makeAnagram(word){return{
  kind:'input',question:`Собери слово из букв: ${shuffleLetters(word).join(' ')}`,
  placeholder:'Введи слово',answers:[word.toLowerCase()],
  hint:`Слово начинается на «${word[0].toUpperCase()}».`,
  success:`Слово «${word.toUpperCase()}» собрано!`};}
function makeMissingLetter(word){
  const idx=Math.floor(word.length/2),missing=word[idx];
  const shown=word.split('').map((l,i)=>i===idx?'_':l).join('').toUpperCase();
  return{kind:'input',question:`Допиши пропущенную букву: ${shown}`,
    placeholder:'Буква или слово',answers:[missing.toLowerCase(),word.toLowerCase()],
    hint:'Вспомни целое слово.',success:`Буква «${missing.toUpperCase()}» на месте!`};}
function makeRhyme(seed){
  const pair=RHYME_PAIRS[seed%RHYME_PAIRS.length];
  const correct=pair[1];
  const others=RHYME_PAIRS.filter(p=>p[1]!==correct).slice(0,2).map(p=>p[1]);
  return{kind:'choice',question:`Найди точную рифму к слову «${pair[0].toUpperCase()}».`,
    options:shuffleOptions([correct,...others],correct).map(o=>o.toUpperCase()),
    answer:correct.toUpperCase(),hint:'Смотри на последние слоги.',
    success:`«${correct.toUpperCase()}» — точная рифма!`};}
function makeCipher(word,shift){return{
  kind:'input',question:`Расшифруй слово (сдвиг на ${shift} вперёд): ${shiftWord(word,shift)}`,
  placeholder:'Введи слово',answers:[word.toLowerCase()],
  hint:`Каждая буква сдвинута на ${shift} вперёд.`,
  success:`Шифр раскрыт: «${word.toUpperCase()}»!`};}
function makeRiddle(seed){
  const r=RIDDLES[seed%RIDDLES.length];
  return{kind:'choice',question:r.q,options:shuffleOptions(r.opts,r.a),answer:r.a,
    hint:'Не спеши — ответ простой.',success:'Верно! Путь открыт.'};}
function makeSynonym(seed){
  const pair=SYNONYM_PAIRS[seed%SYNONYM_PAIRS.length];
  const [base,correct,...wrong]=pair;
  return{kind:'choice',question:`Найди синоним к слову «${base.toUpperCase()}».`,
    options:shuffleOptions([correct,...wrong.slice(0,2)],correct).map(o=>o.toUpperCase()),
    answer:correct.toUpperCase(),hint:'Близкое по смыслу слово.',
    success:`«${correct.toUpperCase()}» — верный синоним!`};}

function hashStr(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function seededShuffle(arr,seed){
  const a=[...arr];let s=seed>>>0;
  for(let i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)>>>0;
    const j=s%(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildExpedition(){
  const chapters=[];
  const worldList=['forest','rhymes','desert','library'];
  worldList.forEach(world=>{
    const wp=WORDS[world];
    const byDiff={1:[],2:[],3:[],4:[],5:[]};
    const seen=new Set();
    for(let diff=1;diff<=5;diff++){
      wp[diff].forEach(word=>{
        if(seen.has(word))return;
        seen.add(word);
        if(word.length>=4){
          if(word.length<=8)byDiff[diff].push({make:()=>makeAnagram(word)});
          byDiff[diff].push({make:()=>makeMissingLetter(word)});
        }
        byDiff[diff].push({make:()=>makeCipher(word,Math.min(4,diff))});
      });
    }
    if(world==='rhymes')RHYME_PAIRS.forEach((_,i)=>byDiff[Math.min(5,Math.floor(i/3)+1)].push({make:()=>makeRhyme(i)}));
    if(world==='desert')RIDDLES.forEach((_,i)=>byDiff[Math.min(5,Math.floor(i/3)+1)].push({make:()=>makeRiddle(i)}));
    if(world==='library')SYNONYM_PAIRS.forEach((_,i)=>byDiff[Math.min(5,Math.floor(i/3)+1)].push({make:()=>makeSynonym(i)}));
    /* ★ По 10 ребусов, 8 обманок, 5 метаграмм на каждый мир */
    EMOJI_REBUSES.forEach((_,i)=>{
      if(i % 4 === worldList.indexOf(world)){
        byDiff[Math.min(5,Math.floor(i/8)+1)].push({make:()=>makeEmojiRebus(i)});
      }
    });
    OBAMANKI.forEach((_,i)=>{
      if(i % 4 === worldList.indexOf(world)){
        byDiff[Math.min(5,Math.floor(i/6)+1)].push({make:()=>makeObmanka(i)});
      }
    });
    METAGRAMMY.forEach((_,i)=>{
      if(i % 4 === worldList.indexOf(world)){
        byDiff[Math.min(5,Math.floor(i/4)+1)].push({make:()=>makeMetagramma(i)});
      }
    });
    const orderedPool=[];
    for(let diff=1;diff<=5;diff++){
      seededShuffle(byDiff[diff],hashStr(world)+diff*997).forEach(item=>orderedPool.push({diff,make:item.make}));
    }
    const texts=EXP_TEXTS[world];
    orderedPool.forEach((item,i)=>{
      chapters.push({
        id:`e_${world}_${i+1}`,world,title:`${WORLDS[world].name} · ${i+1}`,
        arc:'expedition',difficulty:item.diff,text:texts[i%texts.length],
        puzzle:item.make(),reward:{coins:10+item.diff*5,xp:10+item.diff*5}
      });
    });
  });
  return chapters;
}

const EXPEDITION=buildExpedition();

function buildActs(expedition){
  const worldList=['forest','rhymes','desert','library'];
  const storyChapters=['c1','c2','c3','c4','c5','c6','c7','c8','c9'];
  const worldStoryCount={forest:3,rhymes:2,desert:2,library:2};
  const worldTitles={
    forest:['Тропа Лисёнка','Шёпот Деревьев','Сердце Леса'],
    rhymes:['Улица Поэтов','Шифр Барда'],
    desert:['Песочные Часы','Загадка Сфинкса'],
    library:['Страж Страниц','Последняя Глава']
  };
  const acts=[];let actId=1,storyIdx=0;
  worldList.forEach(world=>{
    const count=worldStoryCount[world];
    const total=expedition.filter(c=>c.world===world).length;
    if(!total)return;
    const perAct=Math.ceil(total/count);
    for(let i=0;i<count;i++){
      const from=i*perAct+1;
      const to=Math.min((i+1)*perAct,total);
      if(from>total)break;
      acts.push({id:actId,storyChapter:storyChapters[storyIdx],world,from,to,title:worldTitles[world][i]});
      actId++;storyIdx++;
    }
  });
  return acts;
}

    p.linearRampToValueAtTime(t,n+d);}catch(e){}}

    ngPlus:false,shieldUsedDate:null,hintDailyDate:null,hintDailyUsedDate:null,
    secondUsedDate:null,familyRead:[],tutorialDone:false
  };
}
let state=load();
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return defaultState();
    const def=defaultState();
    const s=Object.assign(def,JSON.parse(raw));
    s.settings=Object.assign(def.settings,s.settings||{});
    s.stats=Object.assign(def.stats,s.stats||{});
    s.dailyChallenge=Object.assign(def.dailyChallenge,s.dailyChallenge||{});
    if(!Array.isArray(s.perks))s.perks=[];
    if(!Array.isArray(s.perksUsed))s.perksUsed=[];
    if(!Array.isArray(s.achievements))s.achievements=[];
    if(typeof s.perkTier!=='number')s.perkTier=0;
    if(!Array.isArray(s.bagOfHearts))s.bagOfHearts=[];
    if(!Array.isArray(s.actsRewarded))s.actsRewarded=[];
    if(!Array.isArray(s.familyRead))s.familyRead=[];
    if(!s.hintUsed) s.hintUsed = {};
    for(const k in s.hintUsed){
      const v = s.hintUsed[k];
      if(v === true) s.hintUsed[k] = 1;
      else if(v === false || v == null || typeof v !== 'number') s.hintUsed[k] = 0;
    }
    return s;
  }catch(e){return defaultState();}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}

(function migrateOrphanChapters(){
  if(!state.completed||!state.completed.length)return;
  const valid=new Set(ALL_CHAPTERS.map(c=>c.id));
  const filtered=state.completed.filter(id=>valid.has(id));
  if(filtered.length!==state.completed.length){state.completed=filtered;save();}
})();

function todayStr(off){const d=new Date();d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]/g,'');}
function recalcLevel(){state.level=1+Math.floor(state.xp/50);}

function applySettings(){
  document.body.classList.remove('text-sm','text-lg','text-xl','high-contrast','reduce-motion','light');
  if(state.settings.fontSize==='sm')document.body.classList.add('text-sm');
  else if(state.settings.fontSize==='lg')document.body.classList.add('text-lg');
  else if(state.settings.fontSize==='xl')document.body.classList.add('text-xl');
  if(state.settings.contrast==='high')document.body.classList.add('high-contrast');
  if(!state.settings.animations)document.body.classList.add('reduce-motion');
  if(state.settings.theme==='light')document.body.classList.add('light');
}

  if(!state.settings.vibration)return;

}

function currentMaxLives(){return BASE_MAX_LIVES+(state.maxLivesBonus||0);}
function getRegenMs(){
  if(state.perks.includes('heart_faster'))return 4*60*1000;
  if(state.perks.includes('heart_fast'))return 6*60*1000;
  return LIFE_REGEN_MS;
}
function coinMult(){return (state.perks.includes('coins_boost')?1.1:1)*(state.ngPlus?1.5:1);}
function xpMult(){return (state.perks.includes('xp_boost')?1.15:1)*(state.ngPlus?1.3:1);}

function hintCost(chId){
  const used = state.hintUsed[chId] || 0;
  const tierMult = [1, 2, 4][Math.min(used, 2)];
  let base = 8 + Math.floor(state.level / 3);
  let cost = Math.round(base * tierMult);
  if(state.perks.includes('hint_cheap')) cost = Math.round(cost * 0.6);
  if(state.perks.includes('hint_daily') && state.hintDailyUsedDate !== todayStr() && used === 0){
    cost = 0;
  }
  return cost;
}
function hintLevel2(ch){
  const p = ch.puzzle;
  if(p.kind === 'input'){
    const ans = p.answers[0];
    return `Первая буква «${ans[0].toUpperCase()}», букв: ${ans.length}`;
  } else {
    const wrong = p.options.find(o => norm(o) !== norm(p.answer));
    return `Точно не подходит: «${wrong}»`;
  }
}
function hintLevel3(ch){
  const p = ch.puzzle;
  if(p.kind === 'input') return `Правильный ответ: ${p.answers[0].toUpperCase()}`;
  return `Правильный ответ: ${p.answer}`;
}

function checkLivesRegen(){
  const max=currentMaxLives();
  if(state.lives>=max){if(state.nextLifeAt){state.nextLifeAt=null;save();}return false;}
  if(!state.nextLifeAt){state.nextLifeAt=Date.now()+getRegenMs();save();return false;}
  let gained=false;const now=Date.now();
  while(now>=state.nextLifeAt&&state.lives<max){
    state.lives++;gained=true;
    if(state.lives>=max){state.nextLifeAt=null;}
    else{state.nextLifeAt+=getRegenMs();}
  }
  if(gained){
    save();
    if(state.settings.notifications && !document.hidden && Notification.permission==='granted'){
      try{new Notification('СловоКвест',{body:'❤️ Сердце восстановилось!',silent:true});}catch(e){}
    }
  }
  return gained;
}
function loseLife(){
  if(state.lives<=0)return false;
  if(state.perks.includes('shield') && state.shieldUsedDate !== todayStr()){
    state.shieldUsedDate = todayStr();
    save(); return 'shielded';
  }
  state.lives--;
  if(state.lives<currentMaxLives()&&!state.nextLifeAt){state.nextLifeAt=Date.now()+getRegenMs();}
  save();return true;
}
function gainLife(){
  if(state.lives>=currentMaxLives())return false;
  state.lives++;
  if(state.lives>=currentMaxLives())state.nextLifeAt=null;
  save();return true;
}
function restoreWithCoins(){
  if(state.lives>=currentMaxLives()||state.coins<LIFE_COST)return false;
  state.coins-=LIFE_COST;state.lives++;
  if(state.lives>=currentMaxLives())state.nextLifeAt=null;
  save();return true;
}
function fmtTime(ms){
  if(ms<=0)return'0:00';
  const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtPlayTime(ms){
  const t=Math.floor(ms/1000);
  const h=Math.floor(t/3600),m=Math.floor((t%3600)/60);
  if(h>0)return `${h}ч ${m}м`;
  return `${m}м`;
}
function heartsEmoji(n){return n>0?'❤️':'🖤';}

function canClaimDailyGift(){return state.dailyGiftDate!==todayStr();}
function claimDailyGift(){
  if(!canClaimDailyGift())return null;
  state.dailyGiftDate=todayStr();
  if(state.lives<currentMaxLives()){
    state.lives++;
    if(state.lives>=currentMaxLives())state.nextLifeAt=null;
    save();return 'heart';
  }else{
    state.coins+=DAILY_GIFT_COINS;
    save();return 'coins';
  }
}
function checkExclusiveReward(world,difficulty){
  if(!world||!difficulty)return null;
  const all=EXPEDITION.filter(c=>c.world===world&&c.difficulty===difficulty);
  if(!all.every(c=>state.completed.includes(c.id)))return null;
  const cardId=`${world}_d${difficulty}`;
  if(state.cards.includes(cardId))return null;
  state.cards.push(cardId);save();
  return cardId;
}
function checkBagOfHearts(world){
  if(!world)return null;
  if(state.bagOfHearts.includes(world))return null;
  const all=EXPEDITION.filter(c=>c.world===world);
  if(!all.every(c=>state.completed.includes(c.id)))return null;
  state.bagOfHearts.push(world);
  state.maxLivesBonus=(state.maxLivesBonus||0)+1;
  if(state.lives<currentMaxLives())state.lives++;
  const cardId=`${world}_bag`;
  if(!state.cards.includes(cardId))state.cards.push(cardId);
  save();
  return cardId;
}
function checkAchievements(){
  const unlocked=[];
  ACHIEVEMENTS.forEach(a=>{
    if(state.achievements.includes(a.id))return;
    if(a.check(state)){state.achievements.push(a.id);unlocked.push(a);}
  });
  if(unlocked.length){
    save();
    unlocked.forEach((a,i)=>{
      setTimeout(()=>{
        toast(`🏆 ${a.emoji} ${a.name}`);
        SFX.achievement();
        vibrate([50,30,50,30,100]);
      }, 500+i*900);
    });
  }
}
function checkPerkTrigger(){
  const tiers=[5,10,15,20];
  tiers.forEach(tier=>{
    if(state.level>=tier&&!state.perksUsed.includes(tier)){
      state.perksUsed.push(tier);
      state.perkTier=Math.max(state.perkTier,tier);
      const avail=ALL_PERKS.filter(p=>p.onLevel===tier&&!state.perks.includes(p.id));
      if(avail.length===1){
        state.perks.push(avail[0].id);
        toast(`🎁 Перк: ${avail[0].emoji} ${avail[0].name}`);
      }else if(avail.length>=2){
        state.pendingPerkChoice={level:tier,options:shuffleArr(avail).slice(0,2)};
      }
      save();
    }
  });
}

function isActComplete(act){
  if(!state.completed.includes(act.storyChapter))return false;
  for(let i=act.from;i<=act.to;i++){
    if(!state.completed.includes(`e_${act.world}_${i}`))return false;
  }
  return true;
}
function isActUnlocked(actId){
  if(actId===1)return true;
  const prev=ACTS.find(a=>a.id===actId-1);
  return prev?isActComplete(prev):false;
}
function getActForChapter(chId){
  const storyAct=ACTS.find(a=>a.storyChapter===chId);
  if(storyAct)return storyAct;
  for(const act of ACTS){
    if(!chId.startsWith(`e_${act.world}_`))continue;
    const num=parseInt(chId.split('_').pop(),10);
    if(num>=act.from&&num<=act.to)return act;
  }
  return null;
}
function isChapterUnlocked(chId){
  const act=getActForChapter(chId);
  if(!act)return false;
  if(!isActUnlocked(act.id))return false;
  if(chId===act.storyChapter)return true;
  if(!state.completed.includes(act.storyChapter))return false;
  if(state.completed.includes(chId))return true;
  for(let i=act.from;i<=act.to;i++){
    const id=`e_${act.world}_${i}`;
    if(!state.completed.includes(id))return id===chId;
  }
  return false;
}
function getNextExpInAct(act){
  if(!state.completed.includes(act.storyChapter))return null;
  for(let i=act.from;i<=act.to;i++){
    const id=`e_${act.world}_${i}`;
    if(!state.completed.includes(id))return id;
  }
  return null;
}
function getNextChapter(){
  for(const act of ACTS){
    if(!isActUnlocked(act.id))return null;
    if(!state.completed.includes(act.storyChapter))return act.storyChapter;
    for(let i=act.from;i<=act.to;i++){
      const id=`e_${act.world}_${i}`;
      if(!state.completed.includes(id))return id;
    }
  }
  return null;
}
function getCurrentAct(){
  const next=getNextChapter();
  if(!next)return ACTS[ACTS.length-1];
  return getActForChapter(next)||ACTS[0];
}
function actProgress(act){
  let done=0,total=1+(act.to-act.from+1);
  if(state.completed.includes(act.storyChapter))done++;
  for(let i=act.from;i<=act.to;i++){
    if(state.completed.includes(`e_${act.world}_${i}`))done++;
  }
  return{done,total,pct:Math.round(done/total*100)};
}
function getDayNumber(){
  return Math.floor((Date.now()-new Date('2024-01-01T00:00:00').getTime())/86400000);
}
function getChallengeChapter(){
  const unplayed = EXPEDITION.filter(c=>!state.completed.includes(c.id));
  if(unplayed.length > 0){
    return unplayed[getDayNumber() % unplayed.length];
  }
  const hard = EXPEDITION.filter(c=>c.difficulty >= 4);
  const pool = hard.length > 0 ? hard : EXPEDITION;
  return pool[getDayNumber() % pool.length];
}

const ONBOARD_SLIDES=[
  {emoji:'📖',title:'Ты — Хранитель Текста',text:'Читай истории, выбирай ответы, разгадывай загадки. Каждое слово — шаг в новую главу.'},
  {emoji:'❤️',title:'Береги сердца',text:'Ошибка забирает сердце. Сердца восстанавливаются со временем — или за монеты.'},
  {emoji:'💡',title:'Подсказки не бесплатны',text:'Первая подсказка дешевле, вторая — дороже, третья — самая дорогая. Но и она покажет ответ.'}
];

function render(){
  if(speedTimer){clearInterval(speedTimer);speedTimer=null;}
  if(!state.tutorialDone){app.innerHTML=onboardingHTML();window.scrollTo(0,0);return;}
  if(state.pendingPerkChoice&&view.screen!=='perk')view.screen='perk';
  const key=view.screen+'|'+(session?.id||'')+'|'+(session?.phase||'')+'|'+(view.expandedActs.join(','));
  if(view.screen==='home')app.innerHTML=homeHTML();
  else if(view.screen==='chapter')app.innerHTML=chapterHTML();
  else if(view.screen==='collection')app.innerHTML=collectionHTML();
  else if(view.screen==='map')app.innerHTML=mapHTML();
  else if(view.screen==='settings')app.innerHTML=settingsHTML();
  else if(view.screen==='achievements')app.innerHTML=achievementsHTML();
  else if(view.screen==='training')app.innerHTML=trainingHTML();
  else if(view.screen==='speed')app.innerHTML=speedStartHTML();
  else if(view.screen==='speed-result')app.innerHTML=speedResultHTML();
  else if(view.screen==='challenge-result')app.innerHTML=challengeResultHTML();
  else if(view.screen==='family')app.innerHTML=familyHTML();
  else if(view.screen==='family-story')app.innerHTML=familyStoryHTML();
  else if(view.screen==='epilogue')app.innerHTML=epilogueHTML();
  else if(view.screen==='perk')app.innerHTML=perkHTML();
  else if(view.screen==='perk-chosen')app.innerHTML=perkChosenHTML();
  else if(view.screen==='license')app.innerHTML=licenseHTML();
  if(key!==lastRenderKey){
    if(!(session&&session.phase==='reward')){
      app.classList.remove('screen-anim');void app.offsetWidth;app.classList.add('screen-anim');
    }
    lastRenderKey=key;
  }
  if(state.coins!==lastCoinsShown){
    const el=app.querySelector('.hud-item b');
    if(el){const item=el.parentElement;item.classList.add('coin-changed');
      setTimeout(()=>item.classList.remove('coin-changed'),700);}
    lastCoinsShown=state.coins;
  }
  if(state.lives!==lastLivesShown||currentMaxLives()!==lastMaxLivesShown){
    const el=app.querySelector('#hud-lives');
    if(el){el.classList.add('heart-changed');
      setTimeout(()=>el.classList.remove('heart-changed'),700);}
    lastLivesShown=state.lives;lastMaxLivesShown=currentMaxLives();
  }
  let mWorld='default',mMood='calm';
  if(view.screen==='chapter'&&session){
    const ch=getChapter(session.id);if(ch)mWorld=ch.world;
    if(session.phase==='puzzle')mMood='tension';
  }else if(view.screen==='map'||view.screen==='home'){const a=getCurrentAct();if(a)mWorld=a.world;}
  MUSIC.setWorld(mWorld);MUSIC.setMood(mMood);
  window.scrollTo(0,0);
  if(view.screen==='chapter'&&session&&session.mode==='speed'&&session.phase==='puzzle'){
    const st=session.speedStartTime;
    speedTimer=setInterval(()=>{
      const el=document.getElementById('speed-time');
      if(el)el.textContent=Math.floor((Date.now()-st)/1000)+'с';
    },250);
  }
}

function onboardingHTML(){
  const slide=ONBOARD_SLIDES[onboardStep];
  const dots=ONBOARD_SLIDES.map((_,i)=>
    `<div class="onboard-dot ${i===onboardStep?'active':''}"></div>`).join('');
  const isLast=onboardStep===ONBOARD_SLIDES.length-1;
  return `<div class="card onboard">
    <span class="onboard-emoji">${slide.emoji}</span>
    <h2>${slide.title}</h2>
    <p>${slide.text}</p>
    <div class="onboard-dots">${dots}</div>
    <button class="btn btn-primary" data-action="onboard-next">${isLast?'Начать игру':'Далее'}</button>
    ${!isLast?`<button class="onboard-skip" data-action="onboard-skip">Пропустить</button>`:''}
  </div>`;
}

function hud(){
  const max=currentMaxLives();
  const livesDisplay=max>BASE_MAX_LIVES?`${state.lives}/${max}`:`${state.lives}`;
  return `<div class="hud">
    <div class="hud-item">🪙 <b>${state.coins}</b></div>
    <div class="hud-item">⭐ <b>${state.level}</b> ур.</div>
    <div class="hud-item" id="hud-lives">${heartsEmoji(state.lives)} <b>${livesDisplay}</b></div>
    <button class="hud-mute" data-action="toggle-sfx">${SFX.muted?'🔇':'🔊'}</button>
    <button class="hud-mute" data-action="toggle-music">${MUSIC.muted?'🔕':'🎵'}</button>
  </div>`;
}

function homeHTML(){
  const currentAct=getCurrentAct();
  const nextId=getNextChapter();
  const nextCh=nextId?getChapter(nextId):null;
  const giftAvailable=canClaimDailyGift();
  const giftGivesHeart=state.lives<currentMaxLives();
  const prog=actProgress(currentAct);
  const familyUnlocked=state.actsRewarded.length>=1;
  const challengeDone=state.dailyChallenge.lastDate===todayStr();
  let mainBtn;
  if(state.lives<=0){
    const secondAvail = state.perks.includes('second') && state.secondUsedDate !== todayStr();
    mainBtn=`<div class="no-lives">
      <div class="no-lives-emoji">💔</div>
      <div style="font-weight:600;margin-bottom:6px">Сердца закончились</div>
      <div class="sub" style="margin:0">Одно сердце через</div>
      <div class="no-lives-countdown" id="lives-countdown">${state.nextLifeAt?fmtTime(state.nextLifeAt-Date.now()):'—'}</div>
      ${secondAvail?`<button class="btn btn-primary" data-action="use-second">🔄 Вернуть сердце (1 раз в день)</button>`:''}
      <button class="btn ${secondAvail?'btn-ghost':'btn-primary'}" data-action="restore-lives"
        ${state.coins<LIFE_COST?'disabled':''}>Восстановить за ${LIFE_COST} 🪙</button>
    </div>`;
  }else if(nextCh){
    mainBtn=`<button class="btn btn-primary" data-action="start-chapter" data-id="${nextCh.id}">
      ${nextCh.arc==='story'?'👑 ':''}Продолжить${state.ngPlus?' ⚔️':''}</button>`;
  }else{
    mainBtn=`<button class="btn btn-primary" data-action="start-chapter" data-id="c1">🔄 Переиграть историю</button>`;
  }
  const actsMini=ACTS.map(act=>{
    const unlocked=isActUnlocked(act.id);
    const done=isActComplete(act);
    const current=currentAct.id===act.id;
    const cls=done?'done':(current?'current':(unlocked?'':'locked'));
    return `<div class="act-mini ${cls}" data-action="tap-act" data-act="${act.id}">${act.id}</div>`;
  }).join('');
  const giftBtn=giftAvailable
    ?`<button class="btn btn-gift" data-action="claim-gift">🎁 Подарок · ${giftGivesHeart?'+1 ❤️':'+'+DAILY_GIFT_COINS+' 🪙'}</button>`
    :`<button class="btn btn-ghost" data-action="claim-gift" disabled>🎁 Завтра новый подарок</button>`;
  const actHeader=`<div class="act-banner">
    <div class="act-num">Акт ${currentAct.id}${state.ngPlus?' · ⚔️ NG+':''}</div>
    <div class="act-title">${WORLDS[currentAct.world].emoji} ${currentAct.title}</div>
    <div class="act-progress-line">${prog.done} / ${prog.total} глав акта</div>
    <div class="progress" style="margin:6px 0 0"><i style="width:${prog.pct}%"></i></div>
  </div>`;
  return `
    <div class="hero-wrap">${svgHero()}</div>
    <h1>СловоКвест</h1>
    <p class="sub">Хранители Текста · текстовый квест</p>
    ${hud()}
    <div class="card">
      ${actHeader}
      ${mainBtn}
      ${giftBtn}
      <button class="btn btn-ghost" data-action="open-daily-challenge">${challengeDone?'📅 Вызов пройден · завтра новый':'📅 Ежедневный вызов'}</button>
      <button class="btn btn-ghost" data-action="open-map">🗺️ Карта приключений</button>
      <button class="btn btn-ghost" data-action="open-training">🎯 Тренировка</button>
      <button class="btn btn-ghost" data-action="open-speed">⚡ Скоростной забег</button>
      ${familyUnlocked?`<button class="btn btn-ghost" data-action="open-family">👨‍👩‍👧 Семейный вечер</button>`:''}
      <button class="btn btn-ghost" data-action="open-collection">📚 Коллекция · ${state.cards.length}</button>
      <button class="btn btn-ghost" data-action="open-achievements">🏆 Достижения · ${state.achievements.length} / ${ACHIEVEMENTS.length}</button>
      <button class="btn btn-ghost" data-action="open-settings">⚙️ Настройки</button>
    </div>
    <p style="font-size:12px;color:#a99cb8;margin:0 0 8px">Акты</p>
    <div class="acts-mini">${actsMini}</div>
    <button class="reset" data-action="reset">сбросить прогресс</button>
    ${authorFooter()}`;
}

function mapHTML(){
  const currentAct=getCurrentAct();
  const blocks=ACTS.map(act=>{
    const unlocked=isActUnlocked(act.id);
    const done=isActComplete(act);
    const current=currentAct.id===act.id;
    const expanded=view.expandedActs.includes(act.id);
    const prog=actProgress(act);
    const cls=`act-block ${unlocked?'':'locked'} ${current?'current':''} ${done?'done':''} ${expanded?'expanded':''}`;
    const storyDone=state.completed.includes(act.storyChapter);
    const storyCh=getChapter(act.storyChapter);
    const storyBtnCls=`story-card-btn ${storyDone?'done':''} ${!unlocked?'locked':''}`;
    let dots='';
    if(expanded&&unlocked){
      const nextId=getNextExpInAct(act);
      const items=[];
      for(let i=act.from;i<=act.to;i++){
        const realId=`e_${act.world}_${i}`;
        const isDone=state.completed.includes(realId);
        const unlockedNow=isChapterUnlocked(realId);
        const isNext=(realId===nextId);
        let dotCls='exp-dot';
        if(isDone)dotCls+=' done';
        else if(!unlockedNow)dotCls+=' locked';
        else if(isNext)dotCls+=' next';
        items.push(`<button class="${dotCls}" data-action="start-exp" data-id="${realId}" ${unlockedNow?'':'disabled'}>${i}</button>`);
      }
      dots=`<div class="exp-grid">${items.join('')}</div>`;
    }
    return `<div class="${cls}">
      <div class="act-header" data-action="toggle-act" data-act="${act.id}">
        <div class="act-num-big">${WORLDS[act.world].emoji}</div>
        <div class="act-head-info">
          <div class="act-head-title">Акт ${act.id}: ${act.title}</div>
          <div class="act-head-meta">${WORLDS[act.world].name} · ${prog.done} / ${prog.total}${done?' · ✓':''}</div>
          <div class="progress ${done?'green':''}" style="margin:4px 0 0"><i style="width:${prog.pct}%"></i></div>
        </div>
        <div class="act-chevron">▶</div>
      </div>
      <div class="act-body">
        <div class="act-story-btn">
          <button class="${storyBtnCls}" data-action="start-chapter" data-id="${act.storyChapter}">
            <span class="crown">${storyDone?'✓':'👑'}</span>
            <span>${storyCh.title}</span>
          </button>
        </div>
        ${dots}
      </div>
    </div>`;
  }).join('');
  return `<button class="back" data-action="home">← На главную</button>
    <h2>🗺️ Карта приключений</h2>
    <p class="sub">Иди по следам — открыта только следующая глава</p>
    <div style="margin-top:16px">${blocks}</div>
    ${authorFooter()}`;
}

function startChapter(id,mode){
  const ch=getChapter(id);if(!ch)return;
  if(!mode){
    if(!isChapterUnlocked(id)){toast('🔒 Сначала пройди предыдущие главы');return;}
    if(state.lives<=0&&!state.completed.includes(id)){toast('💔 Сердца закончились');return;}
  }
  let variantText=null;
  if(ch.variant){for(const k in ch.variant){if(state.flags[k]){variantText=ch.variant[k];break;}}}
  session={id,phase:'text',variantText,choiceResponse:null,choiceCard:null,
           error:null,locked:false,exclusiveCard:null,bagCard:null,
           lifeEarned:false,actCompleted:null,ngCard:null,
           mode:mode||'normal',returnTo:'home',testErrors:0,
           isReplay:state.completed.includes(id)};
  view.screen='chapter';render();
}
function startTest(id){
  session={id,phase:'puzzle',mode:'test',testErrors:0,error:null,
           locked:false,exclusiveCard:null,bagCard:null,lifeEarned:false,
           actCompleted:null,ngCard:null,isReplay:false,returnTo:'home'};
  view.screen='chapter';render();
}
function startTraining(){
  const open=EXPEDITION.filter(c=>state.completed.includes(c.id));
  if(open.length<1){toast('Сначала пройди хотя бы одну главу');return;}
  const picked=open[Math.floor(Math.random()*open.length)];
  startChapter(picked.id,'training');
}
function startSpeedRun(){
  const open=EXPEDITION.filter(c=>state.completed.includes(c.id));
  if(open.length<10){toast('Нужно хотя бы 10 пройденных глав');return;}
  const picked=shuffleArr(open).slice(0,10).map(c=>c.id);
  session={mode:'speed',speedChapters:picked,speedIndex:0,speedErrors:0,speedCorrect:0,
           speedStartTime:Date.now(),id:picked[0],phase:'puzzle',
           error:null,locked:false,isReplay:false};
  view.screen='chapter';render();
}
function startDailyChallenge(){
  const ch=getChallengeChapter();
  session={id:ch.id,phase:'puzzle',mode:'challenge',
           challengeStartTime:Date.now(),challengeErrors:0,
           challengeDay:getDayNumber(),error:null,locked:false,isReplay:false};
  view.screen='chapter';render();
}
function diffStars(d){return d?'<span class="diff-stars">'+'⭐'.repeat(d)+'</span>':'';}

function chapterHTML(){
  const ch=getChapter(session.id);
  const theme=WORLD_THEME[ch.world];
  const isReplay=state.completed.includes(ch.id);
  const back=`<button class="back" data-action="go-back">← Назад</button>`;
  const tag=`<div style="text-align:center"><div class="world-tag" style="--accent:${theme.accent}">
    ${WORLDS[ch.world].emoji} ${WORLDS[ch.world].name}${diffStars(ch.difficulty)}</div></div>`;
  let speedHud='';
  if(session.mode==='speed'){
    speedHud=`<div class="speed-hud">
      <div>Глава<b>${session.speedIndex+1}/10</b></div>
      <div>Время<b id="speed-time">0с</b></div>
      <div>Ошибки<b>${session.speedErrors}/3</b></div>
    </div>`;
  }
  let modeTag='';
  if(session.mode==='training')modeTag='<div style="text-align:center;font-size:12px;color:#7ab8f5;margin-bottom:8px">🎯 Тренировка — без потерь и наград</div>';
  else if(session.mode==='test')modeTag='<div style="text-align:center;font-size:12px;color:#e8b64c;margin-bottom:8px">🔁 Испытание — без ошибок × 2 награда</div>';
  else if(session.mode==='challenge')modeTag='<div style="text-align:center;font-size:12px;color:#e8b64c;margin-bottom:8px">📅 Ежедневный вызов #'+session.challengeDay+'</div>';
  if(session.phase==='text'&&session.mode!=='speed'){
    const v=session.variantText?`<div class="variant">${session.variantText}</div>`:'';
    const paras=ch.text.map((p,i)=>`<p style="animation-delay:${0.15+i*0.18}s">${p}</p>`).join('');
    const nextAction=ch.choice?'to-choice':'to-puzzle';
    const nextLabel=ch.choice?'Дальше':'К загадке';
    const testBtn=isReplay?`<button class="btn btn-ghost" data-action="start-test" data-id="${ch.id}">🔁 Испытание</button>`:'';
    return `${back}
      <div class="chapter-banner">${worldScene(ch.world)}</div>
      ${tag}<h2 style="text-align:center">${ch.title}</h2>
      ${modeTag}
      <div class="story">${v}${paras}</div>
      <button class="btn btn-primary" data-action="${nextAction}"
        style="animation:slideUp .4s ease ${0.15+ch.text.length*0.18}s both">${nextLabel}</button>
      ${testBtn}`;
  }
  if(session.phase==='choice'&&session.mode!=='speed'){
    const opts=ch.choice.options.map((o,i)=>
      `<button class="btn btn-opt anim-in" style="animation-delay:${0.1+i*0.12}s"
        data-action="choose" data-i="${i}">${o.text}</button>`).join('');
    return `${back}<div class="chapter-banner" style="opacity:.9">${worldScene(ch.world)}</div>
      ${tag}<h2 style="text-align:center">${ch.title}</h2>${modeTag}<p class="prompt">${ch.choice.prompt}</p>${opts}`;
  }
  if(session.phase==='choiceResult'&&session.mode!=='speed'){
    return `${back}<div class="chapter-banner" style="opacity:.9">${worldScene(ch.world)}</div>
      ${tag}<h2 style="text-align:center">${ch.title}</h2>
      <div class="card"><div class="story"><p style="animation-delay:.05s">${session.choiceResponse}</p></div></div>
      <button class="btn btn-primary" data-action="to-puzzle"
        style="animation:slideUp .4s ease .2s both">К загадке</button>`;
  }
  if(session.phase==='puzzle'){
    if(state.lives<=0&&!isReplay&&session.mode!=='speed'&&session.mode!=='training'&&session.mode!=='challenge'){
      const secondAvail = state.perks.includes('second') && state.secondUsedDate !== todayStr();
      return `${back}${tag}<h2 style="text-align:center">${ch.title}</h2>
        <div class="card puzzle-blocked">
          <div class="no-lives-emoji">💔</div>
          <h2 style="margin:8px 0">Сердца закончились</h2>
          <div class="no-lives-countdown" id="lives-countdown">${state.nextLifeAt?fmtTime(state.nextLifeAt-Date.now()):'—'}</div>
          ${secondAvail?`<button class="btn btn-primary" data-action="use-second">🔄 Вернуть сердце (1 раз в день)</button>`:''}
          <button class="btn ${secondAvail?'btn-ghost':'btn-primary'}" data-action="restore-lives"
            ${state.coins<LIFE_COST?'disabled':''}>Восстановить за ${LIFE_COST} 🪙</button>
          <button class="btn btn-ghost" data-action="go-back">Выйти</button>
        </div>`;
    }
    const p=ch.puzzle;let body='';
    if(p.emoji){
      body+=`<div class="emoji-rebus">${p.emoji}</div>`;
    }
    if(p.kind==='input'){
      body+=`<input type="text" id="puzzle-input" placeholder="${p.placeholder||'Ответ'}"
        autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn btn-primary" data-action="submit-input">Проверить</button>`;
    }else{
      body+=p.options.map(o=>`<button class="btn btn-opt" data-action="submit-choice"
        data-value="${o}">${o}</button>`).join('');
    }
    const err=session.error?`<div class="err">${session.error}</div>`:'';
    const showHints = session.mode==='normal'||session.mode==='training';
    const hintsUsed = state.hintUsed[ch.id] || 0;
    let hintBlock = '';
    if(showHints){
      if(hintsUsed >= 1) hintBlock += `<div class="hint-box">💡 ${p.hint}</div>`;
      if(hintsUsed >= 2) hintBlock += `<div class="hint-box" style="margin-top:6px">🔤 ${hintLevel2(ch)}</div>`;
      if(hintsUsed >= 3) hintBlock += `<div class="hint-box" style="margin-top:6px;color:#e8b64c;font-weight:600">🎯 ${hintLevel3(ch)}</div>`;
    }
    let hintBtn = '';
    if(showHints && hintsUsed < 3){
      const cost = hintCost(ch.id);
      const label = hintsUsed === 0 ? '💡 Подсказка' : hintsUsed === 1 ? '🔤 Ещё подсказка' : '🎯 Показать ответ';
      const costLabel = cost === 0 ? 'бесплатно' : cost + ' 🪙';
      hintBtn = `<button class="btn btn-ghost" data-action="hint">${label} (${costLabel})</button>`;
    }
    const shareBtn = session.mode==='normal' && !isReplay ? 
      `<button class="btn btn-ghost" data-action="share-chapter">📤 Отправить другу</button>` : '';
    const replayNote=(isReplay&&session.mode==='normal')?'<div class="sub" style="text-align:center;margin:4px 0 0;font-size:11px">Повтор — без потери сердец</div>':'';
    return `${back}${speedHud}${tag}<h2 style="text-align:center">${ch.title}</h2>
      <div class="puzzle-icon" style="--accent:${theme.accent}">${WORLDS[ch.world].emoji}</div>
      ${modeTag}${replayNote}
      <div class="${session.error?'shake':''}">
        <p class="prompt" style="text-align:center">${p.question}</p>${body}${err}
      </div>${hintBlock}${hintBtn}${shareBtn}`;
  }
  if(session.phase==='reward'){
    const r=ch.reward,card=r.card?CARDS[r.card]:null;
    const already=session.replay;
    const banners=[];
    if(session.bagCard)banners.push({type:'bag',card:CARDS[session.bagCard]});
    if(session.ngCard)banners.push({type:'ngplus',card:CARDS[session.ngCard]});
    if(session.exclusiveCard)banners.push({type:'exclusive',card:CARDS[session.exclusiveCard]});
    if(session.actCompleted){
      const act=ACTS.find(a=>a.id===session.actCompleted);
      if(act)banners.push({type:'act',act});
    }
    let frameEmoji=WORLDS[ch.world].emoji,frameSvg=null;
    if(card){frameEmoji=card.emoji;frameSvg=cardArt(r.card);}
    const cardBlock=`<div class="reward-card-frame" style="--accent:${theme.accent}">
        <div class="reward-emoji">${frameSvg||frameEmoji}</div></div>`;
    const shareTxt=`Прошёл «${ch.title}» в СловоКвесте · Ур.${state.level}`;
    let bannersHtml='';
    if(banners.length === 1){
      bannersHtml = renderBanner(banners[0]);
    } else if(banners.length > 1){
      bannersHtml = renderBanner(banners[0]) +
        `<button class="btn btn-ghost" data-action="show-more-banners" style="margin-top:8px">
          📋 Ещё наград: ${banners.length-1}</button>`;
      session.hiddenBanners = banners.slice(1);
    }
    return `${back}
      <div class="card reward">
        ${cardBlock}
        <h2 style="text-align:center;animation:slideUp .4s ease .3s both">${ch.puzzle.success}</h2>
        ${already?'<p class="sub" style="text-align:center;margin-top:12px">Глава пройдена ранее</p>'
                 :`<div class="coins-earned">+${r.coins} 🪙 · +${r.xp} ⭐</div>

function chooseOption(i){
  const ch=getChapter(session.id);
  const opt=ch.choice.options[i];
  if(opt.flag)state.flags[opt.flag]=true;
  if(opt.card&&!state.cards.includes(opt.card))state.cards.push(opt.card);
  session.choiceResponse=opt.response;session.choiceCard=opt.card||null;
  session.phase='choiceResult';save();render();
}
function submitInput(){
  if(session.locked)return;
  const inp=document.getElementById('puzzle-input');if(!inp)return;
  checkAnswer(inp.value);
}
function checkAnswer(value){
  const ch=getChapter(session.id);
  const ok=ch.puzzle.answers.some(a=>norm(a)===norm(value));
  if(ok){finishChapter();return;}
  handleWrong();
}
function submitChoice(value){
  if(session.locked)return;
  const ch=getChapter(session.id);
  if(norm(value)===norm(ch.puzzle.answer)){finishChapter();return;}
  handleWrong();
}
function handleWrong(){
  SFX.wrong();vibrate([30,40,30]);
  state.stats.totalAnswers++;state.stats.wrongAnswers++;
  if(session.mode==='test'){session.testErrors++;}
  if(session.mode==='speed'){
    session.speedErrors++;
    if(session.speedErrors>=3){finishSpeed(false);return;}
    session.error='Ошибка! Осталось: '+(3-session.speedErrors);
    save();render();return;
  }
  if(session.mode==='challenge'){
    session.challengeErrors++;
    session.error='Ошибка — но попытка одна. Пробуй ещё.';
    save();render();return;
  }
  if(session.mode==='training'){
    session.error='Не страшно — это тренировка.';
    save();render();return;
  }
  const isReplay=state.completed.includes(session.id);
  let lost=false;
  if(!isReplay){
    const r=loseLife();
    if(r==='shielded'){session.error='🛡️ Щит спас твоё сердце!';save();render();return;}
    if(r){lost=true;setTimeout(()=>SFX.lifeLost(),200);vibrate(100);}
  }
  if(lost&&state.lives<=0){session.error=null;session.locked=true;}
  else{session.error='Не совсем. Попробуй ещё раз.';}
  save();render();
}
function showHint(){
  const ch=getChapter(session.id);
  const used = state.hintUsed[ch.id] || 0;
  if(used >= 3){toast('Больше подсказок нет');return;}
  const cost = hintCost(ch.id);
  if(state.coins < cost){
    session.error='Не хватает монет на подсказку';
    SFX.wrong();render();return;
  }
  state.coins -= cost;
  if(cost === 0 && state.perks.includes('hint_daily') && used === 0){
    state.hintDailyUsedDate = todayStr();
  }
  state.hintUsed[ch.id] = used + 1;
  session.error = null;
  save();SFX.click();render();
}
function finishChapter(){
  if(session.locked)return;
  session.locked=true;SFX.correct();vibrate(15);
  document.body.classList.add('correct-flash');
  setTimeout(()=>{document.body.classList.remove('correct-flash');doFinishChapter();},380);
}
function doFinishChapter(){
  const ch=getChapter(session.id);
  if(session.mode==='speed'){
    session.speedCorrect=(session.speedCorrect||0)+1;
    session.speedIndex++;
    if(session.speedIndex>=10){finishSpeed(true);return;}
    session.id=session.speedChapters[session.speedIndex];
    session.phase='puzzle';session.error=null;session.locked=false;
    render();return;
  }
  if(session.mode==='test'){
    const passed=session.testErrors===0;
    const mult=passed?2:1;
    state.coins+=Math.round(ch.reward.coins*mult);
    state.xp+=Math.round(ch.reward.xp*mult);
    if(passed)state.stats.testsPassed++;
    recalcLevel();
    view.screen='challenge-result';
    session={mode:'test-result',passed,mult,chTitle:ch.title,
             errors:session.testErrors,coins:Math.round(ch.reward.coins*mult),
             xp:Math.round(ch.reward.xp*mult)};
    save();render();SFX.reward();vibrate([20,30,20,30,60]);
    setTimeout(confetti,150);checkAchievements();checkPerkTrigger();save();
    return;
  }
  if(session.mode==='challenge'){
    const time=Math.floor((Date.now()-session.challengeStartTime)/1000);
    const stars=session.challengeErrors===0?3:session.challengeErrors===1?2:1;
    const chDay=session.challengeDay;
    const lastDate=state.dailyChallenge.lastDate;
    if(lastDate===todayStr(-1))state.dailyChallenge.streak++;
    else if(lastDate!==todayStr())state.dailyChallenge.streak=1;
    state.dailyChallenge.lastDate=todayStr();
    state.dailyChallenge.history.push({day:chDay,time,stars,errors:session.challengeErrors});
    state.dailyDoneDate=todayStr();
    const rewardCoins=25+stars*10;
    state.coins+=rewardCoins;state.xp+=20+stars*10;
    recalcLevel();
    view.screen='challenge-result';
    session={mode:'challenge-result',day:chDay,time,stars,errors:session.challengeErrors,
             coins:rewardCoins,streak:state.dailyChallenge.streak};
    save();render();SFX.reward();vibrate([20,30,20,30,60]);
    setTimeout(confetti,150);checkAchievements();checkPerkTrigger();save();
    return;
  }
  if(session.mode==='training'){
    state.stats.trainingsDone++;
    view.screen='home';session=null;save();render();
    toast('🎯 Тренировка завершена');checkAchievements();save();
    return;
  }
  session.replay=state.completed.includes(ch.id);
  const oldLevel=state.level;let leveledUp=false;
  session.exclusiveCard=null;session.bagCard=null;session.lifeEarned=false;
  session.actCompleted=null;session.ngCard=null;
  if(!session.replay){
    state.completed.push(ch.id);
    const coins=Math.round(ch.reward.coins*coinMult());
    const xp=Math.round(ch.reward.xp*xpMult());
    state.coins+=coins;state.xp+=xp;
    if(ch.reward.card&&!state.cards.includes(ch.reward.card))state.cards.push(ch.reward.card);
    recalcLevel();leveledUp=state.level>oldLevel;
    /* Считаем ребусы для достижения */
    if(ch.puzzle.isRebus){state.stats.rebusesSolved=(state.stats.rebusesSolved||0)+1;}
    if(ch.arc==='expedition'){
      session.exclusiveCard=checkExclusiveReward(ch.world,ch.difficulty);
      session.bagCard=checkBagOfHearts(ch.world);
    }
    if(gainLife())session.lifeEarned=true;
    const chapterAct=getActForChapter(ch.id);
    if(chapterAct&&isActComplete(chapterAct)&&!state.actsRewarded.includes(chapterAct.id)){
      state.actsRewarded.push(chapterAct.id);
      state.coins+=ACT_BONUS;
      session.actCompleted=chapterAct.id;
      if(chapterAct.id===ACTS.length){
        if(!state.ngPlus && !state.stats.epilogueSeen){state.stats.epilogueSeen=true;}
        else if(state.ngPlus){
          state.stats.ngPlusCompletions=(state.stats.ngPlusCompletions||0)+1;
          const ngId = state.stats.ngPlusCompletions === 1 ? 'ngplus_hero' : 'ngplus_legend';
          if(!state.cards.includes(ngId)){state.cards.push(ngId);session.ngCard = ngId;}
        }
      }
    }
  }
  session.phase='reward';session.error=null;save();render();
  setTimeout(()=>SFX.reward(),60);
  if(ch.reward.card)setTimeout(()=>SFX.card(),500);
  setTimeout(()=>SFX.coin(),900);
  if(leveledUp)setTimeout(()=>SFX.levelUp(),1400);
  if(session.actCompleted)setTimeout(()=>SFX.actComplete(),1700);
  if(session.exclusiveCard)setTimeout(()=>SFX.exclusive(),2100);
  if(session.bagCard)setTimeout(()=>SFX.bag(),2400);
  if(session.ngCard)setTimeout(()=>SFX.exclusive(),2600);
  setTimeout(confetti,150);
  vibrate([20,30,20,30,60]);
  checkAchievements();checkPerkTrigger();save();
}
function finishSpeed(win){
  const time=Math.floor((Date.now()-session.speedStartTime)/1000);
  const correct=session.speedCorrect||0;
  state.stats.speedRunsDone++;
  const rewardCoins=win?50:20;
  state.coins+=rewardCoins;state.xp+=win?40:15;
  recalcLevel();
  view.screen='speed-result';
  session={mode:'speed-result',win,time,errors:session.speedErrors,correct,coins:rewardCoins};
  save();render();
  if(win){SFX.exclusive();vibrate([50,30,50,30,100]);setTimeout(confetti,150);}
  else{SFX.lifeLost();vibrate(100);}
  checkAchievements();save();
}
